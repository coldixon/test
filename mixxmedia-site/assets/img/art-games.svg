<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A card game moving from cardboard onto a screen">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14c3b2"/><stop offset="1" stop-color="#0a5f60"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g-bg)"/>
  <circle cx="660" cy="110" r="150" fill="#ffffff" opacity=".08"/>

  <!-- physical card, left -->
  <g transform="translate(96 190) rotate(-8)">
    <rect width="180" height="250" rx="16" fill="#fffdf9" opacity=".95"/>
    <circle cx="60" cy="70" r="14" fill="#0a5f60"/><circle cx="100" cy="70" r="14" fill="#0a5f60"/>
    <circle cx="60" cy="112" r="14" fill="#0a5f60"/><circle cx="100" cy="112" r="14" fill="#0a5f60"/>
    <text x="90" y="205" font-family="Georgia, serif" font-size="60" font-weight="700" fill="#0a5f60" text-anchor="middle">4</text>
  </g>

  <!-- the hand-off -->
  <path d="M300 315h108" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".75" stroke-dasharray="2 22"/>
  <path d="M398 300l22 15-22 15z" fill="#ffffff" opacity=".85"/>

  <!-- device, right -->
  <g transform="translate(452 148)">
    <rect width="250" height="330" rx="30" fill="#0b1a1c"/>
    <rect x="12" y="12" width="226" height="306" rx="22" fill="#08302f"/>
    <rect x="40" y="52" width="80" height="112" rx="10" fill="#fffdf9" opacity=".92"/>
    <rect x="132" y="52" width="80" height="112" rx="10" fill="#ffb627" opacity=".9"/>
    <rect x="40" y="182" width="172" height="12" rx="6" fill="#14c3b2" opacity=".7"/>
    <rect x="40" y="206" width="118" height="12" rx="6" fill="#ffffff" opacity=".35"/>
    <circle cx="86" cy="266" r="24" fill="#14c3b2"/>
    <path d="M79 255l20 11-20 11z" fill="#08302f"/>
    <rect x="126" y="252" width="86" height="28" rx="14" fill="#ffffff" opacity=".18"/>
  </g>
</svg>
