<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Three Inklings cards fanned out: a four, a six, and the Inky">
  <defs>
    <linearGradient id="ink-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d5cff"/><stop offset="1" stop-color="#3b1f9e"/>
    </linearGradient>
    <linearGradient id="ink-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf9"/><stop offset="1" stop-color="#f0eae0"/>
    </linearGradient>
    <filter id="ink-lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a0e4d" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#ink-bg)"/>
  <circle cx="118" cy="88" r="150" fill="#ffffff" opacity=".07"/>
  <circle cx="706" cy="524" r="180" fill="#0b0d12" opacity=".12"/>

  <g transform="translate(400 300)" filter="url(#ink-lift)">
    <!-- 4 -->
    <g transform="rotate(-22) translate(-232 -140)">
      <rect width="216" height="290" rx="18" fill="url(#ink-card)"/>
      <text x="26" y="56" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#3b1f9e">4</text>
      <g fill="#6d4aff">
        <circle cx="86" cy="150" r="15"/><circle cx="130" cy="150" r="15"/>
        <circle cx="86" cy="196" r="15"/><circle cx="130" cy="196" r="15"/>
      </g>
    </g>
    <!-- 6 -->
    <g transform="translate(-108 -166)">
      <rect width="216" height="290" rx="18" fill="url(#ink-card)"/>
      <text x="26" y="56" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#0a4c46">6</text>
      <g fill="#0fb3a4">
        <circle cx="66" cy="146" r="15"/><circle cx="108" cy="146" r="15"/><circle cx="150" cy="146" r="15"/>
        <circle cx="66" cy="196" r="15"/><circle cx="108" cy="196" r="15"/><circle cx="150" cy="196" r="15"/>
      </g>
    </g>
    <!-- Inky: the one card nothing blocks -->
    <g transform="rotate(22) translate(16 -140)">
      <rect width="216" height="290" rx="18" fill="#12141c"/>
      <text x="26" y="56" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#ffb627" letter-spacing="3">INKY</text>
      <path d="M108 96c33 0 58 24 58 56 0 25-14 39-14 60 0 15 10 21 10 33 0 13-23 21-54 21s-54-8-54-21c0-12 10-18 10-33 0-21-14-35-14-60 0-32 25-56 58-56z" fill="#ffb627"/>
      <circle cx="92" cy="148" r="9" fill="#12141c"/><circle cx="124" cy="148" r="9" fill="#12141c"/>
    </g>
  </g>
</svg>
